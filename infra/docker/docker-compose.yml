# Local dev stack (Folder Structure §1). Only Postgres+PostGIS and Redis are
# needed for Phase 2's scope — OSRM/Nominatim/MinIO are Maps/Storage
# providers this phase explicitly excludes (docs/21-phase2-foundation-audit.md)
# and are added to this file when Phase 4 (Maps Platform) needs them.
name: taxitawsila

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: taxitawsila
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
